<body><canvas id="c" width="800" height="576"></canvas>
<script>
(()=>{'use strict';
// ===== CORE: setup, input, audio, utils =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=800,H=576,TS=32;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),PK=a=>a[Math.floor(Math.random()*a.length)];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT=(s,b,i)=>`${i?'italic ':''}${b?'bold ':''}${s}px "Courier New",monospace`;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function srng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}

let G=null,F={};
const S={mode:'title',t:0,fade:0,fadeTo:0,toast:null,whisper:null,menu:null,b:null,wc:0,shakeT:0,flashA:0,sel:0};
const P={x:0,y:0,dir:2,ox:0,oy:0,mv:false};
let M=null,gen=null,cur=null;
const MAPS={};
const stage=()=>G?((F.starter?1:0)+(F.slept?1:0)+(F.maren?1:0)+(F.heron?1:0)+(F.kesTower?1:0)):0;

// ----- input -----
const held={},hit=new Set();
const kn=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{
  const k=kn(e);audio();
  if(cur&&cur.t==='name'){nameKey(e,k);e.preventDefault();return;}
  if(!held[k])hit.add(k);held[k]=true;
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();
});
addEventListener('keyup',e=>{held[kn(e)]=false;});
const isA=()=>hit.has('z')||hit.has('Enter')||hit.has(' ');
const isB=()=>hit.has('x')||hit.has('Escape')||hit.has('Backspace');
const isU=()=>hit.has('ArrowUp')||hit.has('w'),isD=()=>hit.has('ArrowDown')||hit.has('s');
const isL=()=>hit.has('ArrowLeft')||hit.has('a'),isRt=()=>hit.has('ArrowRight')||hit.has('d');
function heldDir(){
  if(held.ArrowUp||held.w)return 0;if(held.ArrowDown||held.s)return 2;
  if(held.ArrowLeft||held.a)return 3;if(held.ArrowRight||held.d)return 1;return -1;
}

// ----- audio -----
let AC=null,drone=null;
function audio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const o1=AC.createOscillator(),o2=AC.createOscillator(),gn=AC.createGain();
    o1.frequency.value=55;o2.frequency.value=55.7;gn.gain.value=.02;
    o1.connect(gn);o2.connect(gn);gn.connect(AC.destination);o1.start();o2.start();drone={o1,o2,gn};
  }catch(e){}
}
function sfx(f,d=.06,type='square',v=.03){
  if(!AC)return;
  try{const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;
    gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
function droneTick(){if(drone){const st=stage();drone.o2.frequency.value=55.7+st*.9;drone.gn.gain.value=.02+st*.006;}}

// ----- drawing helpers -----
function box(x,y,w,h,fill,stroke){
  g.fillStyle=fill||'rgba(12,9,20,.93)';g.fillRect(x,y,w,h);
  g.strokeStyle=stroke||'#e8e0c8';g.lineWidth=3;g.strokeRect(x+1.5,y+1.5,w-3,h-3);
  g.strokeStyle='#5a5070';g.lineWidth=1;g.strokeRect(x+6.5,y+6.5,w-13,h-13);
}
function text(s,x,y,size=18,col='#f0ead8',align='left',bold=false,ital=false){
  g.font=FONT(size,bold,ital);g.fillStyle=col;g.textAlign=align;g.textBaseline='top';g.fillText(s,x,y);
}
function wrap(txt,w,font){
  g.font=font;const words=txt.split(' '),out=[];let l='';
  for(const wd of words){const t=l?l+' '+wd:wd;if(g.measureText(t).width>w&&l){out.push(l);l=wd;}else l=t;}
  if(l)out.push(l);return out;
}
function ell(x,y,rx,ry,c,rot=0){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,7);g.fill();}
function tri(a,b,c,d,e,f,col){g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill();}

// ----- script command constructors -----
const say=(...lines)=>({t:'say',lines});
const ask=(q,opts)=>({t:'choice',q,opts});
const wait=ms=>({t:'wait',ms});
const fade=(a,ms=400)=>({t:'fade',a,ms});
const cut=(...lines)=>({t:'cut',lines});
const shake=ms=>({t:'shake',ms});
const bm=text=>({t:'bmsg',text});
const bwait=ms=>({t:'bwait',ms});
function note(k,tx){
  if(!G||G.notes.some(n=>n.k===k))return;
  G.notes.push({k,t:tx});S.toast={text:'Journal updated',t:2.4};
}
// ===== DATA: types, moves, species =====
const TCOL={plain:'#a8a090',flame:'#e8602c',tide:'#3a8fd8',bloom:'#58b04a',spark:'#e8c820',gloom:'#8a5ac0'};
const EFFT={flame:{bloom:2,tide:.5,flame:.5},tide:{flame:2,bloom:.5,tide:.5},bloom:{tide:2,flame:.5,bloom:.5},
  spark:{tide:2,bloom:.5,spark:.5},gloom:{plain:2,gloom:.5}};
const eff=(a,d)=>(EFFT[a]&&EFFT[a][d])||1;

const MVraw={
  tackle:['Tackle','plain',40,100],scratch:['Scratch','plain',40,100],peck:['Quick Peck','plain',35,100],
  slam:['Body Slam','plain',65,95],growl:['Growl','plain',0,100,'atkdown'],brace:['Brace','plain',0,100,'defup'],mend:['Mend','plain',0,100,'heal'],
  ember:['Ember','flame',45,100],flamefang:['Flame Fang','flame',65,95],inferno:['Inferno','flame',90,85],
  bubble:['Bubble','tide',45,100],tidalslap:['Tidal Slap','tide',65,95],surge:['Surge','tide',90,85],
  vine:['Vine Lash','bloom',45,100],thorn:['Thorn Barrage','bloom',65,95],bloomburst:['Bloom Burst','bloom',90,85],
  spark:['Spark','spark',45,100],thunderfang:['Thunder Fang','spark',65,95],overload:['Overload','spark',90,85],
  shade:['Shade Bite','gloom',50,100],nightmaw:['Night Maw','gloom',75,90],hollowcry:['Hollow Cry','gloom',95,85]
};
const MV={};for(const k in MVraw){const a=MVraw[k];MV[k]={id:k,name:a[0],type:a[1],pow:a[2],acc:a[3],eff:a[4]};}

// name,type,[hp,atk,def,spd],exp,catch,learn,look,dex[early,late]
const SP={};
function sp(id,name,type,b,exp,ct,learn,look,dex){SP[id]={id,name,type,b,exp,catch:ct,learn,look,dex};}
sp('embit','Embit','flame',[44,52,43,56],60,.4,[[1,'scratch'],[1,'growl'],[5,'ember'],[12,'flamefang'],[20,'inferno']],
  {shape:'quad',c1:'#e8793a',c2:'#f8d890',feat:'flame'},
  ['A small fox with a flame at its tail. Warm to the touch and loyal to its Tamer.','Its tail gutters whenever you come near. It keeps one eye on the door. It has never once looked at you directly.']);
sp('dribb','Dribb','tide',[48,48,50,48],60,.4,[[1,'tackle'],[1,'growl'],[5,'bubble'],[12,'tidalslap'],[20,'surge']],
  {shape:'blob',c1:'#4a9ae0',c2:'#bfe4ff',feat:'drop'},
  ['Slippery and playful. Loves puddles and praise.','It hides under the water when you pass. It surfaces only after you have gone.']);
sp('sprout','Sprout','bloom',[50,46,52,42],60,.4,[[1,'tackle'],[1,'brace'],[5,'vine'],[12,'thorn'],[20,'bloomburst']],
  {shape:'quad',c1:'#7ac050',c2:'#d8f0a0',feat:'leaf'},
  ['A bulb-backed grazer that photosynthesises while it naps.','Its leaves curl when you stand close. The Wardens call it Hollow-wilt.']);
sp('flitwing','Flitwing','plain',[40,45,38,62],50,.6,[[1,'peck'],[1,'growl'],[8,'tackle'],[15,'slam']],
  {shape:'bird',c1:'#b89c78',c2:'#f0e4cc'},
  ['A common sky-messenger. Sings at dawn.','Songbirds fall silent within ten paces of the Hollow.']);
sp('mossling','Mossling','bloom',[55,38,50,28],50,.6,[[1,'tackle'],[4,'vine'],[9,'brace'],[16,'thorn']],
  {shape:'blob',c1:'#5a8a40',c2:'#9cc870',feat:'leaf'},
  ['A gentle blob that carpets old stones.','Mosslings pile up in your path and refuse to move. Some call it surrender. Some call it prayer.']);
sp('puddlet','Puddlet','tide',[44,42,40,50],50,.6,[[1,'bubble'],[1,'tackle'],[9,'brace'],[14,'tidalslap']],
  {shape:'frog',c1:'#4e8ad0',c2:'#cfe6ff'},
  ['A rain-loving frog. Its croak predicts storms.','Near you it croaks a single note, over and over. A warning.']);
sp('zapkit','Zapkit','spark',[38,50,36,64],55,.4,[[1,'tackle'],[3,'spark'],[10,'growl'],[15,'thunderfang']],
  {shape:'quad',c1:'#e8d040',c2:'#fff4a0',feat:'bolt'},
  ['A static-furred kit. Zaps when startled.','Its fur stands on end around you, though there is no static in the air.']);
sp('cindrel','Cindrel','flame',[42,54,38,58],55,.4,[[1,'scratch'],[4,'ember'],[13,'flamefang']],
  {shape:'quad',c1:'#c04830',c2:'#f0a060',feat:'flame'},
  ['A coal-feathered pup. Fears nothing.','Fears one thing.']);
sp('dusklet','Dusklet','gloom',[40,48,40,66],65,.25,[[1,'peck'],[3,'shade'],[10,'growl'],[16,'nightmaw']],
  {shape:'moth',c1:'#5a4a88',c2:'#a890d8'},
  ['A night moth drawn to lanterns.','It is not drawn to lanterns. It is drawn to you. It remembers you.']);
sp('fennick','Fennick','flame',[50,58,48,60],70,.2,[[1,'scratch'],[1,'ember'],[8,'mend'],[10,'flamefang'],[18,'inferno']],
  {shape:'quad',c1:'#d8602a',c2:'#fff0d0',feat:'flame'},
  ['A bright-eared fox that partners with Wardens.','Maren\'s partner sleeps beside the door, in case it must run.']);
sp('thornlet','Thornlet','bloom',[52,56,52,40],65,.3,[[1,'tackle'],[1,'vine'],[8,'brace'],[10,'thorn'],[18,'bloomburst']],
  {shape:'quad',c1:'#3f8a3c',c2:'#bce08a',feat:'thorn'},
  ['A thorny little grazer. Prickly with strangers.','Its thorns lie flat around you. Submission, or exhaustion.']);
sp('marshhop','Marshhop','tide',[58,54,52,45],60,.5,[[1,'bubble'],[1,'slam'],[10,'brace'],[15,'tidalslap'],[20,'surge']],
  {shape:'frog',c1:'#3f9a8a',c2:'#d0f0e0'},
  ['A big-mouthed frog of the fen. Swallows lanterns whole.','It dives and does not come up while you are on the boardwalk.']);
sp('reedback','Reedback','tide',[52,50,48,56],60,.45,[[1,'bubble'],[1,'vine'],[11,'tidalslap'],[16,'mend']],
  {shape:'serpent',c1:'#4a8a70',c2:'#c8e8b0',feat:'leaf'},
  ['A river serpent that hides in the reeds.','The reeds lean away from you. So does it.']);
sp('voltmink','Voltmink','spark',[48,56,44,70],65,.35,[[1,'spark'],[1,'tackle'],[9,'growl'],[12,'thunderfang'],[20,'overload']],
  {shape:'quad',c1:'#5a5ad8',c2:'#e8e8ff',feat:'bolt'},
  ['A fast, crackling hunter of the marsh.','It hunts everything in the fen. It does not hunt you.']);
sp('gloomjaw','Gloomjaw','gloom',[62,66,52,50],80,.15,[[1,'shade'],[1,'growl'],[12,'nightmaw'],[20,'hollowcry']],
  {shape:'quad',c1:'#3a2a58',c2:'#9a7ac8',feat:'horn'},
  ['A fear-feeding beast of the deep fen.','It does not bow to the Wardens. It bows to something else.']);
sp('wardhound','Wardhound','plain',[64,60,60,58],75,.1,[[1,'tackle'],[1,'growl'],[8,'slam'],[14,'brace'],[20,'nightmaw']],
  {shape:'quad',c1:'#8a8a96',c2:'#e0e0e8',feat:'horn'},
  ['A loyal guardian bred by the Wardens.','Trained to hunt the Hollow. It trembles when it finds one.']);
sp('elderhart','Elderhart','gloom',[70,64,64,56],90,.05,[[1,'shade'],[1,'slam'],[14,'nightmaw'],[18,'mend'],[22,'hollowcry']],
  {shape:'quad',c1:'#2a2a3a',c2:'#d8c8a8',feat:'horn'},
  ['An ancient antlered Wild. Rarely seen.','It knew you before you had a face.']);
const DEXORDER=Object.keys(SP);

// ----- mons -----
const need=L=>Math.floor(.6*L*L*L);
function calc(m){
  const b=SP[m.sp].b,L=m.lv,old=m.mhp||0;
  m.mhp=Math.floor(2*b[0]*L/100)+L+10;
  m.atk=Math.floor(2*b[1]*L/100)+5;m.def=Math.floor(2*b[2]*L/100)+5;m.spd=Math.floor(2*b[3]*L/100)+5;
  return m.mhp-old;
}
function mkMon(id,lv){
  const m={sp:id,name:SP[id].name,lv,exp:need(lv),mhp:0,hp:0,moves:[]};
  calc(m);m.hp=m.mhp;
  for(const [l,mv] of SP[id].learn)if(l<=lv&&!m.moves.includes(mv))m.moves.push(mv);
  while(m.moves.length>4)m.moves.shift();
  m.st={atk:0,def:0};return m;
}
function gainExp(m,amt){
  const out=[];m.exp+=amt;
  while(m.lv<50&&m.exp>=need(m.lv+1)){
    m.lv++;const d=calc(m);m.hp=Math.min(m.mhp,m.hp+d);
    out.push(`${m.name} grew to Lv.${m.lv}!`);
    for(const [l,mv] of SP[m.sp].learn)if(l===m.lv&&!m.moves.includes(mv)){
      if(m.moves.length>=4){const f=m.moves.shift();out.push(`${m.name} forgot ${MV[f].name}...`);}
      m.moves.push(mv);out.push(`${m.name} learned ${MV[mv].name}!`);
    }
  }
  return out;
}
const stg=s=>s>=0?(2+s)/2:2/(2-s);
function calcDmg(a,d,mv){
  if(!mv.pow)return 0;
  const A=a.atk*stg(a.st.atk),D=d.def*stg(d.st.def);
  let dm=((2*a.lv/5+2)*mv.pow*A/D)/50+2;
  dm*=(SP[a.sp].type===mv.type?1.3:1)*eff(mv.type,SP[d.sp].type)*R(.85,1);
  return Math.max(1,Math.floor(dm));
}
const healAll=()=>{for(const m of [...G.party,...G.box]){m.hp=m.mhp;}};

// ----- journal / flavour lines -----
const WHISPERS=[
  [],
  ['...is it hungry?','the birds went quiet again.','the grass leans away from you.'],
  ['you remember the taste.','they can hear you coming.','you never sleep. you only close your eyes.'],
  ['you are not who they say you are.','count the cages. count them.','you have been here before.'],
  ['it was never a game.','you already know your name.','hungry. hungry. hungry.'],
  ['go up the stairs.','it is almost over.','you can stop pretending.']
];
const FEAR=[
  [],
  ['The wild {n} is trembling. It does not run.','The wild {n} goes very still.'],
  ['The wild {n} will not look at you.','The wild {n} is shaking so hard it can barely stand.','Every bird nearby has gone quiet.'],
  ['The wild {n} is staring at your hands.','The wild {n} lowers itself to the ground, as if already caged.','It is not afraid of the Cage. It is afraid of you.'],
  ['The wild {n} bows its head.','The wild {n} whispers something you almost understand.'],
  ['The wild {n} bows its head. It has been waiting for you.']
];
// ===== RENDER: tiles, people, creatures =====
const SOLID=new Set('#~RrqWwXTBKbHMPFL'.split(''));
function drawTile(m,ch,tx,ty,sx,sy){
  const h=((tx*73856093)^(ty*19349663))>>>0,r=(h%97)/97,t=S.t;
  const fill=c=>{g.fillStyle=c;g.fillRect(sx,sy,TS,TS);};
  const rc=(c,x,y,w,hh)=>{g.fillStyle=c;g.fillRect(sx+x,sy+y,w,hh);};
  const grass=()=>{fill('#5a9a46');rc('#6aae54',(h>>3)%26,(h>>6)%26,2,4);rc('#4c8a3c',(h>>9)%26,(h>>4)%26,2,3);};
  const floor=()=>{fill('#caa56e');rc('#b8935c',0,TS-1,TS,1);if(r<.3)rc('#b8935c',(h>>3)%28,0,1,TS);};
  switch(ch){
    case '.':fill('#b89a68');if(r<.45){rc('#a88a5a',(h>>3)%24,(h>>7)%24,3,2);rc('#c8aa78',(h>>5)%26,(h>>9)%26,2,2);}break;
    case 'g':grass();break;
    case 'f':grass();rc(['#f0e060','#f08ca0','#fff'][h%3],(h>>3)%24+2,(h>>5)%24+2,4,4);rc('#e8e8a0',(h>>7)%24+2,(h>>9)%24+4,3,3);break;
    case 'G':fill('#3f8a3c');g.fillStyle='#2f7030';for(let i=0;i<4;i++){const x=(i*9+(h>>i))%26,y=(i*7+(h>>(i+2)))%20;g.fillRect(sx+x,sy+y+4,2,10);g.fillRect(sx+x+3,sy+y+7,2,8);}
      rc('#58a850',(h>>2)%24,(h>>5)%20,2,6);break;
    case 'm':fill('#4d7550');rc('#3f6a68',(h>>2)%18,(h>>5)%18,10,5);rc('#5e8a5a',(h>>4)%26,(h>>8)%26,2,6);rc('#3c5f3e',(h>>6)%26,(h>>3)%26,2,5);break;
    case '=':fill('#9a7648');for(let i=0;i<4;i++)rc(i%2?'#8a6a3e':'#a8834f',0,i*8,TS,7);break;
    case '~':{fill(m.id==='route2'?'#27483f':'#2d6aa6');g.fillStyle='rgba(255,255,255,.16)';const o=Math.sin(t*2+tx*.7+ty)*4;g.fillRect(sx+6+o,sy+10,12,2);g.fillRect(sx+14-o,sy+22,10,2);break;}
    case '#':grass();rc('#3a2a1a',13,19,6,11);ell(sx+16,sy+13,14,13,'#2c6632');ell(sx+12,sy+9,8,7,'#3d8442');break;
    case 'R':case 'r':case 'q':{fill(ch==='R'?'#9a4a3a':ch==='r'?'#3a5a8a':'#4a7a4a');g.fillStyle='rgba(0,0,0,.22)';for(let i=0;i<4;i++)g.fillRect(sx,sy+i*8+7,TS,2);if(r<.5)rc('rgba(255,255,255,.1)',(h>>3)%24,(h>>5)%24,6,3);break;}
    case 'W':fill('#d8cba6');rc('#b8a888',0,TS-3,TS,3);rc('#b8a888',TS-2,0,2,TS);break;
    case 'w':fill('#d8cba6');rc('#5a4a38',6,5,20,20);rc('#6a9ac0',8,7,16,16);rc('#bfe4ff',10,9,5,5);rc('#5a4a38',15,7,2,16);break;
    case 'D':if(m.interior){floor();rc('#8a3a3a',2,8,28,16);rc('#c8a050',2,8,28,2);}else{fill('#d8cba6');rc('#5a3a22',5,2,22,30);rc('#7a5232',7,4,18,28);rc('#e0c060',21,18,3,3);}break;
    case ',':floor();break;
    case 'C':fill('#8a2f3a');rc('#c8a050',0,0,2,TS);rc('#c8a050',TS-2,0,2,TS);break;
    case 'X':fill('#5f5068');g.fillStyle='rgba(0,0,0,.25)';g.fillRect(sx,sy+15,TS,2);g.fillRect(sx+(ty%2?8:20),sy,2,15);g.fillRect(sx+(ty%2?20:8),sy+17,2,15);break;
    case 'T':floor();rc('#7a5232',0,6,TS,20);rc('#946a42',0,6,TS,6);break;
    case 'K':floor();rc('#6a4528',0,6,TS,22);rc('#b88a58',0,6,TS,8);break;
    case 'B':floor();rc('#7a5232',2,4,28,26);rc('#e8e0d0',4,6,24,8);rc('#8a3a5a',4,14,24,14);break;
    case 'b':floor();rc('#4a3220',1,0,30,32);for(let i=0;i<3;i++){for(let j=0;j<5;j++)rc(['#a84a4a','#4a6aa8','#5a9a5a','#c8a850'][(i+j+tx)%4],3+j*5,3+i*10,4,8);rc('#2a1a10',1,11+i*10,30,2);}break;
    case 'H':floor();rc('#8a8a98',2,6,28,22);rc('#aaaab8',2,6,28,5);{const a=.5+.5*Math.sin(t*3);ell(sx+16,sy+19,6,6,`rgba(255,120,160,${.5+a*.5})`);}break;
    case 'P':floor();ell(sx+16,sy+16,12,12,'#8a8a98');ell(sx+14,sy+14,7,7,'#a8a8b8');break;
    case 'F':grass();rc('#8a6a3e',0,12,TS,4);rc('#8a6a3e',0,20,TS,4);rc('#6a4a2a',4,8,4,20);rc('#6a4a2a',24,8,4,20);break;
    case 'L':fill('#b89a68');rc('#3a3a44',14,8,4,22);ell(sx+16,sy+8,9,9,'rgba(255,200,100,.25)');ell(sx+16,sy+8,4,4,'#ffd880');break;
    case 'M':drawMirror(m,sx,sy);break;
    default:fill('#222');
  }
}
function drawMirror(m,sx,sy){
  g.fillStyle='#5f5068';g.fillRect(sx,sy,TS,TS);
  g.fillStyle='#c8a050';g.fillRect(sx+2,sy+1,28,30);
  g.fillStyle='#8aa4b8';g.fillRect(sx+4,sy+3,24,26);
  const st=stage();
  g.fillStyle='rgba(20,20,30,.85)';
  // reflection: human early, something else later

function flame(x,y,s){const f=Math.sin(S.t*12)*.15;tri(x-s*.5,y,x,y-s*(1.2+f),x+s*.5,y,'#f08020');tri(x-s*.28,y,x,y-s*(.8+f),x+s*.28,y,'#ffe060');}
function bolt(x,y,s){g.fillStyle='#fff070';g.beginPath();g.moveTo(x,y);g.lineTo(x+s*.4,y-s*.3);g.lineTo(x+s*.1,y-s*.3);g.lineTo(x+s*.5,y-s*.9);g.lineTo(x-s*.1,y-s*.4);g.lineTo(x+s*.15,y-s*.4);g.closePath();g.fill();}

// world entities
function drawEnt(e,sx,sy){
  if(e.vis&&!e.vis())return;
  switch(e.kind){
    case 'sign':ell(sx+16,sy+28,9,3,'rgba(0,0,0,.25)');g.fillStyle='#6a4a2a';g.fillRect(sx+14,sy+16,4,14);g.fillStyle='#b8905a';g.fillRect(sx+5,sy+5,22,14);g.fillStyle='#4a3220';g.fillRect(sx+8,sy+9,16,2);g.fillRect(sx+8,sy+13,12,2);break;
    case 'item':{const b=Math.sin(S.t*4)*1.5;ell(sx+16,sy+27,8,3,'rgba(0,0,0,.3)');g.fillStyle='#caa050';g.fillRect(sx+8,sy+10+b,16,15);g.strokeStyle='#6a4a20';g.lineWidth=2;for(let i=0;i<4;i++){g.beginPath();g.moveTo(sx+11+i*4,sy+10+b);g.lineTo(sx+11+i*4,sy+25+b);g.stroke();}break;}
    case 'mon':drawMon(e.sp,sx+16,sy+14,e.size||34,{flip:e.flip,fear:e.fear});break;
    case 'obj':e.draw(sx,sy,e);break;

// ===== ENGINE: scripts, overworld =====
function startScript(fn){gen=fn();cur=null;advance();}
function advance(v){
  if(!gen)return;
  let r;
  try{r=gen.next(v);}catch(e){console.error(e);document.title='ERR '+e.message;gen=null;cur=null;if(S.mode==='battle'){S.mode='world';S.b=null;}return;}
  if(r.done){gen=null;cur=null;return;}
  cur=r.value;initCmd(cur);
}
const SPK=/^(@|[A-Z][A-Za-z]+(?: [A-Z][a-z]+)?): ([\s\S]*)$/;
function parseLines(lines){
  return lines.map(l=>{
    l=String(l).replace(/\{n\}/g,G?G.name:'');let who=null;const m=l.match(SPK);
    if(m){who=m[1]==='@'?G.name:m[1];l=m[2];}
    return {who,txt:l,w:wrap(l,690,FONT(20))};
  });
}
function initCmd(c){
  switch(c.t){
    case 'say':c.i=0;c.ch=0;c.L=parseLines(c.lines);break;
    case 'cut':c.i=0;c.ch=0;c.L=c.lines.map(l=>({txt:l.replace(/\{n\}/g,G?G.name:''),w:wrap(l.replace(/\{n\}/g,G?G.name:''),620,FONT(24,false,true))}));break;
    case 'choice':c.sel=0;break;
    case 'wait':c.left=c.ms/1000;break;
    case 'shake':S.shakeT=c.ms/1000;advance();break;
    case 'name':c.buf='';break;
    case 'walk':c.i=0;break;
    case 'excl':c.e.excl=true;c.left=.6;break;
    default:if(initExtra)initExtra(c);
  }
}
function nameKey(e,k){
  if(k==='Enter'){if(cur.buf.length){sfx(520,.05);advance(cur.buf);}return;}
  if(k==='Backspace'){cur.buf=cur.buf.slice(0,-1);return;}
  if(k.length===1&&/[a-z0-9 ]/i.test(k)&&cur.buf.length<10){cur.buf+=e.key;sfx(380,.03);}
}
function updCmd(dt){
  const c=cur;if(!c)return;
  switch(c.t){
    case 'say':{
      const L=c.L[c.i],n=L.txt.length,prev=c.ch;c.ch=Math.min(n,c.ch+dt*60);
      if(Math.floor(c.ch/3)!==Math.floor(prev/3)&&c.ch<n)sfx(260+RI(0,60),.02,'square',.01);
      if(isA()){if(c.ch<n)c.ch=n;else{c.i++;c.ch=0;sfx(520,.04);if(c.i>=c.L.length)advance();}}
      break;}
    case 'cut':{
      const L=c.L[c.i];c.ch+=dt;
      if(isA()&&c.ch>.5){c.i++;c.ch=0;if(c.i>=c.L.length)advance();}
      break;}
    case 'choice':{
      if(isU())c.sel=(c.sel+c.opts.length-1)%c.opts.length;
      if(isD())c.sel=(c.sel+1)%c.opts.length;
      if(isA()){sfx(520,.05);advance(c.sel);}
      break;}
    case 'wait':c.left-=dt;if(c.left<=0)advance();break;
    case 'fade':{
      const sp=dt*1000/c.ms;
      if(S.fade<c.a)S.fade=Math.min(c.a,S.fade+sp);else S.fade=Math.max(c.a,S.fade-sp);
      if(S.fade===c.a)advance();
      break;}
    case 'walk':{
      const e=c.e;
      if(!e.mv){
        if(c.i>=c.path.length){advance();break;}
        const [x,y]=c.path[c.i++];
        for(let d=0;d<4;d++)if(e.x+DX[d]===x&&e.y+DY[d]===y)stepEnt(e,d);
      }
      break;}
    case 'excl':c.left-=dt;if(c.left<=0){c.e.excl=false;advance();}break;
    default:if(updExtra)updExtra(dt,c);
  }
}

// ----- movement -----
function stepEnt(e,d){e.dir=d;e.x+=DX[d];e.y+=DY[d];e.ox=-DX[d]*TS;e.oy=-DY[d]*TS;e.mv=true;if(e===P)G.steps++;}
function tileSolid(x,y){return x<0||y<0||x>=M.w||y>=M.h||SOLID.has(M.t[y][x]);}
function walkable(x,y,self){
  if(tileSolid(x,y))return false;
  if(self!==P&&P.x===x&&P.y===y)return false;
  for(const e of M.ents)if(e!==self&&e.solid&&e.x===x&&e.y===y&&(!e.vis||e.vis()))return false;
  return true;
}
function entsMove(dt){
  let arrived=false;
  for(const e of [P,...M.ents]){
    if(!e.mv)continue;
    const sp=TS*(e===P?5.4:4.6)*dt;
    e.ox=e.ox>0?Math.max(0,e.ox-sp):Math.min(0,e.ox+sp);
    e.oy=e.oy>0?Math.max(0,e.oy-sp):Math.min(0,e.oy+sp);
    if(e.ox===0&&e.oy===0){e.mv=false;if(e===P)arrived=true;}
  }
  return arrived;
}
function pathTo(e,tx,ty){
  const q=[[e.x,e.y]],prev={},key=(x,y)=>x+','+y;prev[key(e.x,e.y)]=null;
  while(q.length){
    const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(let d=0;d<4;d++){
      const nx=x+DX[d],ny=y+DY[d],k=key(nx,ny);
      if(k in prev)continue;
      if(!(nx===tx&&ny===ty)&&!walkable(nx,ny,e))continue;
      if(tileSolid(nx,ny))continue;
      prev[k]=[x,y];q.push([nx,ny]);
    }
  }
  if(!(key(tx,ty) in prev))return[];
  const out=[];let k=key(tx,ty);
  while(prev[k]){const [x,y]=k.split(',').map(Number);out.unshift([x,y]);k=key(...prev[k]);}
  return out;
}
function approach(e){const p=pathTo(e,P.x,P.y);p.pop();return{t:'walk',e,path:p};}
const excl=e=>({t:'excl',e});
const walkTo=(e,x,y)=>({t:'walk',e,path:pathTo(e,x,y)});

function canSee(e){
  for(let k=1;k<=(e.sight||4);k++){
    const x=e.x+DX[e.dir]*k,y=e.y+DY[e.dir]*k;
    if(tileSolid(x,y))return false;
    if(x===P.x&&y===P.y)return true;
    if(M.ents.some(o=>o!==e&&o.solid&&o.x===x&&o.y===y&&(!o.vis||o.vis())))return false;
  }
  return false;
}

function setMap(id,x,y,dir){
  G.map=id;M=MAPS[id];P.x=x;P.y=y;if(dir!=null)P.dir=dir;P.mv=false;P.ox=P.oy=0;
  S.area={text:M.name,t:2.4};
}
function* goto(id,x,y,dir){
  yield fade(1,250);setMap(id,x,y,dir);yield fade(0,250);
  if(M.enter)yield* M.enter();
}

function interact(){
  const fx=P.x+DX[P.dir],fy=P.y+DY[P.dir];
  const e=M.ents.find(o=>o.x===fx&&o.y===fy&&(!o.vis||o.vis())&&o.talk);
  if(e){if(e.kind==='npc')e.dir=(P.dir+2)%4;startScript(function*(){yield* e.talk(e);});return;}
  const lk=M.look[fx+','+fy];
  if(lk)startScript(lk);
}

function arrive(){
  S.wc++;
  const d=M.doors.find(d=>d.x===P.x&&d.y===P.y);
  if(d){startScript(function*(){yield* goto(d.to,d.tx,d.ty,d.dir);});return;}
  for(const tr of M.trig){
    if(tr.at.some(p=>p[0]===P.x&&p[1]===P.y)&&!(tr.flag&&F[tr.flag])&&(!tr.when||tr.when())){
      if(tr.flag)F[tr.flag]=1;startScript(tr.run);return;
    }
  }
  for(const e of M.ents){
    if(e.trainer&&(!e.vis||e.vis())&&!F['t_'+e.trainer.id]&&canSee(e)){startScript(function*(){yield* trainerFight(e,true);});return;}
  }
  const ch=M.t[P.y][P.x];
  if((ch==='G'||ch==='m')&&M.enc&&Math.random()<.13){startScript(wildEncounter);return;}
  if(stage()>=1&&S.wc>=24){S.wc=0;S.whisper={text:PK(WHISPERS[Math.min(stage(),5)]),t:3.4};}
}
function rollWild(){
  const tot=M.enc.reduce((a,e)=>a+e.w,0);let r=Math.random()*tot;
  for(const e of M.enc){r-=e.w;if(r<=0)return{sp:e.sp,lv:RI(e.lv[0],e.lv[1])};}
  return{sp:M.enc[0].sp,lv:M.enc[0].lv[0]};
}
function* wildEncounter(){const r=yield* doBattle({kind:'wild',team:[rollWild()],bg:M.bg});yield* afterBattle(r);}
function* afterBattle(r){if(r==='lose')yield* blackout();}
function* blackout(){
  yield fade(1,500);
  G.money=Math.floor(G.money/2);healAll();
  const h=G.lastHeal;setMap(h.map,h.x,h.y,2);
  yield fade(0,600);
  if(stage()<2)yield say("Everything went dark.","You wake up where it is warm. Someone has healed your Wilds.");
  else{
    yield say("Everything went dark.","You wake up somewhere warm. You don't remember walking here.","Your hands are muddy. There is something under your nails that isn't mud.");
    note('blackout',"I blacked out and woke up somewhere else, hands dirty. I never remember the walk back.");
  }
}

// ----- world update/draw -----
function updWorld(dt){
  if(entsMove(dt)&&!gen)arrive();
  if(gen){updCmd(dt);return;}
  if(S.menu){updMenu();return;}
  if(!P.mv){
    if(isB()||hit.has('m')){openMenu();return;}
    if(isA()){interact();return;}
    const d=heldDir();
    if(d>=0){P.dir=d;if(walkable(P.x+DX[d],P.y+DY[d],P))stepEnt(P,d);}
  }
}
function cam(){
  const px=P.x*TS+P.ox+TS/2,py=P.y*TS+P.oy+TS/2,mw=M.w*TS,mh=M.h*TS;
  let cx=px-W/2,cy=py-H/2;

function catchLines(name){
  const st=stage();
  return [
    [`Gotcha! ${name} was caged!`],
    [`The Cage clicks shut. ${name} didn't struggle.`,`You feel warm. Fuller. For a moment.`],
    [`The Cage snaps shut around ${name}.`,`It stares at you through the bars. Not afraid anymore. Just very tired.`,`Something inside you settles, like a meal.`],
    [`${name} is caged.`,`You didn't feel the cage close. You felt yourself close.`,`You are less hungry now. You hate that you are less hungry.`],
    [`${name} is caged. As the door shut, it whispered: "forgive."`],
    [`${name} is caged. It does not look at you. Neither of you pretends anymore.`]
  ][Math.min(st,5)];
}
function* doBattle(o){
  const wild=o.kind==='wild';
  const foes=o.team.map(t=>mkMon(t.sp,t.lv));
  const first=G.party.findIndex(m=>m.hp>0);
  if(first<0)return 'lose';
  const B=S.b={wild,foes,fi:0,foe:foes[0],me:G.party[first],bg:o.bg||'grass',trainer:o.trainer||null,
    foeShake:0,meShake:0,foeDead:0,meDead:0,cage:null,ui:null};
  G.party.forEach(m=>{m.st={atk:0,def:0};});
  yield fade(1,300);S.mode='battle';yield fade(0,300);
  G.seen[B.foe.sp]=1;
  const nm=m=>m===B.me?m.name:(wild?'Wild ':'Foe ')+m.name;
  const st=stage();
  if(wild){
    yield bm(`A wild ${B.foe.name} appeared!`);
    if(st>=1&&Math.random()<.3+st*.1){
      yield bm(PK(FEAR[Math.min(st,5)]).replace('{n}',B.foe.name));
      if(st>=3)note('wildfear',"The wild ones don't run from me. They kneel. They go still. Like they know.");
      else note('wildfreeze',"Wild creatures freeze when I get close. They don't even try to flee.");
    }
  }else{
    yield bm(`${B.trainer.name} wants to battle!`);
    yield bm(`${B.trainer.name} sent out ${B.foe.name}!`);
  }
  yield bm(`Go, ${B.me.name}!`);

  function pickFoeMove(){
    const ms=B.foe.moves.map(k=>MV[k]);
    const w=ms.map(m=>m.pow?m.pow*eff(m.type,SP[B.me.sp].type)*(SP[B.foe.sp].type===m.type?1.3:1):18);
    let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;
    for(let i=0;i<ms.length;i++){r-=w[i];if(r<=0)return ms[i];}
    return ms[0];
  }
  function* strike(att,def,mv){
    yield bm(`${nm(att)} used ${mv.name}!`);
    if(Math.random()*100>mv.acc){yield bm('It missed!');return;}
    if(mv.pow>0){
      const e=eff(mv.type,SP[def.sp].type),d=calcDmg(att,def,mv);
      def.hp=Math.max(0,def.hp-d);
      if(def===B.foe)B.foeShake=1;else B.meShake=1;
      sfx(110,.14,'sawtooth',.04);
      yield bwait(500);
      if(e>1)yield bm("It's super effective!");else if(e<1)yield bm("It's not very effective...");
    }else if(mv.eff==='atkdown'){def.st.atk=Math.max(-3,def.st.atk-1);yield bm(`${nm(def)}'s attack fell!`);}
    else if(mv.eff==='defup'){att.st.def=Math.min(3,att.st.def+1);yield bm(`${nm(att)}'s defense rose!`);}
    else if(mv.eff==='heal'){att.hp=Math.min(att.mhp,att.hp+Math.floor(att.mhp*.4));yield bm(`${nm(att)} recovered health!`);}
  }
  function* foeFaint(){
    B.foeDead=.01;yield bwait(700);yield bm(`${nm(B.foe)} fainted!`);
    const base=Math.floor(SP[B.foe.sp].exp*B.foe.lv/4*(wild?1:1.5));
    for(const m of G.party){
      if(m.hp<=0)continue;
      const amt=m===B.me?base:Math.max(1,Math.floor(base/2));
      const msgs=gainExp(m,amt);
      if(m===B.me){yield bm(`${m.name} gained ${amt} exp.`);for(const t of msgs)yield bm(t);}
      else for(const t of msgs)if(t.includes('grew'))yield bm(t);
    }
    if(B.fi+1<B.foes.length){
      B.fi++;B.foe=B.foes[B.fi];B.foeDead=0;G.seen[B.foe.sp]=1;
      yield bm(`${B.trainer.name} sent out ${B.foe.name}!`);return 'next';
    }
    return 'win';
  }
  function* meFaint(){
    B.meDead=.01;yield bwait(700);yield bm(`${B.me.name} fainted!`);
    if(!G.party.some(m=>m.hp>0))return 'lose';
    let idx=-1;
    while(idx<0)idx=yield {t:'bparty',mode:'swap',forced:true};
    B.me=G.party[idx];B.me.st={atk:0,def:0};B.meDead=0;
    yield bm(`Go, ${B.me.name}!`);return 'ok';
  }
  const frozen=()=>wild&&st>=2&&Math.random()<.12+.06*(Math.min(st,5)-2);

  let result=null;
  loop:while(true){
    const act=yield {t:'bmenu'};
    let meMove=null;
    if(act.k==='run'){
      if(Math.random()<.75){yield bm('Got away safely!');result='ran';break;}
      yield bm("Couldn't get away!");
    }else if(act.k==='spare'){
      G.mercy++;G.spared++;
      if(st<2)yield bm(`You step back. The wild ${B.foe.name} blinks, then scampers off.`);
      else{yield bm(`You lower your hands. The wild ${B.foe.name} stares at you for a long moment...`);yield bm('Then it bows, and goes.');}
      note('spare',"I let a wild one go. It looked at me like I'd done something impossible.");
      result='spared';break;
    }else if(act.k==='salve'){
      const idx=yield {t:'bparty',mode:'salve'};
      if(idx<0)continue;
      const m=G.party[idx];
      if(m.hp<=0||m.hp>=m.mhp){yield bm("It won't have any effect.");continue;}
      G.bag.salve--;m.hp=Math.min(m.mhp,m.hp+40);yield bm(`${m.name} was patched up.`);
    }else if(act.k==='party'){
      const idx=yield {t:'bparty',mode:'swap'};
      if(idx<0||G.party[idx]===B.me)continue;
      B.me=G.party[idx];B.me.st={atk:0,def:0};yield bm(`Go, ${B.me.name}!`);
    }else if(act.k==='cage'){
      const iron=act.ball==='iron';
      if(iron)G.bag.iron--;else G.bag.cage--;
      yield bm(`You threw the ${iron?'Iron Cage':'Cage'}!`);
      B.cage={state:'fly',t:0,wob:0};yield bwait(800);B.cage.state='shut';
      const ratio=B.foe.hp/B.foe.mhp;
      const p=cl(SP[B.foe.sp].catch*(1.7-1.4*ratio)*(iron?1.7:1),.04,.97),q=Math.pow(p,1/3);
      let n=0;
      for(let i=0;i<3;i++){B.cage.wob=1;sfx(200,.1,'triangle',.05);yield bwait(750);if(Math.random()<q)n++;else break;}
      if(n===3){
        const m=B.foe;G.caught[m.sp]=1;G.hunted++;m.st={atk:0,def:0};
        for(const l of catchLines(m.name))yield bm(l);
        if(G.party.length<6)G.party.push(m);else{G.box.push(m);yield bm(`${m.name} was sent to storage.`);}
        if(G.hunted===1)note('firstcage',"My first cage. It felt good. Why did it feel so good?");
        if(st>=2)note('caged',"When the cage closes, something in me is satisfied. Not happy. Fed.");
        result='caught';break loop;
      }
      B.cage=null;
      yield bm(st>=2?`${B.foe.name} slipped the Cage. For a second it looked relieved.`:`Oh no! ${B.foe.name} broke free!`);
    }else if(act.k==='move'){meMove=MV[B.me.moves[act.i]];}

    const steps=meMove?(B.me.spd>=B.foe.spd?['me','foe']:['foe','me']):['foe'];
    for(const s of steps){
      if(B.me.hp<=0||B.foe.hp<=0)continue;
      if(s==='me'){
        yield* strike(B.me,B.foe,meMove);
        if(B.foe.hp<=0){const r=yield* foeFaint();if(r==='win'){result='win';break loop;}break;}
      }else{
        if(frozen())yield bm(`${nm(B.foe)} is too afraid to move!`);
        else yield* strike(B.foe,B.me,pickFoeMove());
        if(B.me.hp<=0){const r=yield* meFaint();if(r==='lose'){result='lose';break loop;}break;}
      }
    }
  }
  yield fade(1,300);S.mode='world';S.b=null;yield fade(0,300);
  return result;
}

function navGrid(sel,n,cols){

function updExtra(dt,c){

    case 'bmsg':{

function saveGame(){try{G.x=P.x;G.y=P.y;G.dir=P.dir;localStorage.setItem(SAVEKEY,JSON.stringify(G));return true;}catch(e){return false;}}

const MAINMENU=['PARTY','WILDBOOK','BAG','BOX','JOURNAL','SAVE','CLOSE'];

function updMenu(){
  const m=S.menu;
  switch(m.page){
    case 'main':
      if(isU())m.sel=(m.sel+MAINMENU.length-1)%MAINMENU.length;
      if(isD())m.sel=(m.sel+1)%MAINMENU.length;
      if(isB()||hit.has('m')){S.menu=null;break;}
      if(isA()){
        const o=MAINMENU[m.sel];sfx(520,.04);
        if(o==='CLOSE')S.menu=null;
        else if(o==='SAVE'){S.toast={text:saveGame()?'Game saved':'Save failed',t:2};}
        else S.menu={page:o.toLowerCase(),sel:0,sub:null,scroll:0,from:m.sel};
      }
      break;
    case 'party':updPartyMenu(m);break;
    case 'box':updBoxMenu(m);break;
    case 'wildbook':updDexMenu(m);break;
    case 'bag':updBagMenu(m);break;
    case 'journal':
      if(isU())m.scroll=Math.max(0,m.scroll-1);
      if(isD())m.scroll=Math.min(Math.max(0,G.notes.length-6),m.scroll+1);
      if(isB())back(m);
      break;
  }
}
function back(m){S.menu={page:'main',sel:m.from||0,sub:null,scroll:0};}

function updPartyMenu(m){
  if(m.sub==='summary'){if(isA()||isB())m.sub=null;return;}
  if(m.sub==='confirm'){
    if(isL()||isRt()||isU()||isD())m.yes=!m.yes;
    if(isB())m.sub=null;
    if(isA()){
      if(m.yes){const mon=G.party[m.sel];G.party.splice(m.sel,1);G.mercy++;G.spared++;m.sel=0;
        S.toast={text:`${mon.name} was released`,t:2.4};
        note('release',"I let one go. It didn't run. It stayed a moment, then it left, and I felt lighter and heavier at once.");}
      m.sub=null;
    }
    return;
  }
  if(m.sub==='act'){
    if(isU())m.act=(m.act+3)%4;if(isD())m.act=(m.act+1)%4;
    if(isB())m.sub=null;
    if(isA()){
      sfx(520,.04);
      if(m.act===0)m.sub='summary';
      else if(m.act===1){const mon=G.party.splice(m.sel,1)[0];G.party.unshift(mon);m.sel=0;m.sub=null;}
      else if(m.act===2){
        if(G.party.length<=1){S.toast={text:"It won't leave you",t:2.4};m.sub=null;note('stay',"I tried to release my last partner. It wouldn't go. It just stared at me.");}
        else{m.sub='confirm';m.yes=false;}
      }else m.sub=null;
    }
    return;
  }
  if(isU())m.sel=(m.sel+G.party.length-1)%G.party.length;
  if(isD())m.sel=(m.sel+1)%G.party.length;
  if(isB())back(m);
  if(isA()){m.sub='act';m.act=0;sfx(520,.04);}
}
function updBoxMenu(m){
  if(!G.box.length){if(isA()||isB())back(m);return;}
  if(isU())m.sel=(m.sel+G.box.length-1)%G.box.length;
  if(isD())m.sel=(m.sel+1)%G.box.length;
  if(isB())back(m);
  if(isA()){
    const mon=G.box.splice(m.sel,1)[0];
    if(G.party.length<6)G.party.push(mon);else{const out=G.party.pop();G.box.push(out);G.party.push(mon);}
    m.sel=0;sfx(520,.04);
  }
}
function updDexMenu(m){
  if(m.sub==='entry'){if(isA()||isB())m.sub=null;return;}
  if(isU())m.sel=(m.sel+DEXORDER.length-1)%DEXORDER.length;
  if(isD())m.sel=(m.sel+1)%DEXORDER.length;
  if(isB())back(m);
  if(isA()&&G.seen[DEXORDER[m.sel]])m.sub='entry';
}
function updBagMenu(m){
  const items=bagItems();
  if(m.sub==='pick'){
    if(isU())m.t=(m.t+G.party.length-1)%G.party.length;
    if(isD())m.t=(m.t+1)%G.party.length;
    if(isB())m.sub=null;
    if(isA()){const mon=G.party[m.t];
      if(mon.hp>0&&mon.hp<mon.mhp){G.bag.salve--;mon.hp=Math.min(mon.mhp,mon.hp+40);sfx(660,.08);if(G.bag.salve<=0)m.sub=null;}
      else sfx(120,.1);}
    return;
  }
  if(isU())m.sel=(m.sel+items.length-1)%items.length;
  if(isD())m.sel=(m.sel+1)%items.length;
  if(isB())back(m);
  if(isA()&&items[m.sel].id==='salve'&&G.bag.salve>0){m.sub='pick';m.t=0;}
}

function newMap(id,w,h,fill,o){
  const m=Object.assign({id,w,h,t:[],ents:[],doors:[],trig:[],look:{},enc:null,name:id,interior:false,bg:'indoor'},o||{});
  for(let y=0;y<h;y++)m.t.push(new Array(w).fill(fill));

}
const setT=(m,x,y,c)=>{if(x>=0&&y>=0&&x<m.w&&y<m.h)m.t[y][x]=c;};
const rect=(m,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)setT(m,x+i,y+j,c);};
function building(m,x,y,w,roof,door){
  rect(m,x,y,w,2,roof);rect(m,x,y+2,w,2,'W');
  if(w>=4){setT(m,x+1,y+2,'w');setT(m,x+w-2,y+2,'w');}

}
function scatter(m,seed,n,ch){const r=srng(seed);for(let i=0;i<n;i++){const x=Math.floor(r()*m.w),y=Math.floor(r()*m.h);if(m.t[y][x]==='g')m.t[y][x]=ch||'#';}}
function room(id,w,h,name,exitTo,ex,ey,o){

function* trainerFight(e,spotted){
  const T=e.trainer;
  if(F['t_'+T.id]){yield say(...T.post);return;}
  if(spotted){yield excl(e);yield approach(e);}
  yield say(...T.pre);
  const r=yield* doBattle({kind:'trainer',team:T.team,trainer:T,bg:M.bg});
  if(r==='lose'){yield* blackout();return;}
  F['t_'+T.id]=1;G.money+=T.reward;
  yield say(...T.post,`You received ¥${T.reward}.`);
}

function* centerTalk(){
  yield say(...(stage()<2
    ?["Willa: Welcome! Let me take a look at your Wilds.","Willa: ...All patched up. They're so quiet, though. Wilds usually chatter."]
    :["Willa: I'll take them. ...They're fine. They just don't want to go back to you. Isn't that odd?","Willa: Never mind me. Rest well."]));
  healAll();G.lastHeal={map:M.id,x:P.x,y:P.y};
  if(stage()>=2)note('willa',"The nurse says my Wilds are fine, they just don't want to come back to me.");
}

// ----- Ashmere -----
function* motherTalk(){
  if(!F.mother1){
    F.mother1=1;
    yield say("Mother: There you are. Sit, sit. Eat something.",
      "You sit in your usual chair. The stew steams, and smells of nothing at all.",
      "You push it around the bowl. She pretends not to watch.",
      "Mother: Not hungry? Hm. You never are, in the mornings. You always did prefer your meals outdoors.",
      "Mother: Today's the day, isn't it? Professor Alder's been by twice.",
      "She reaches to straighten your collar, and stops, her hand hovering an inch from your neck. She turns it into a wave.",
      "Mother: Your father would be so proud. Here: Cages, a little Salve, some coin for the road.",
      "Mother: And dear? Keep your gloves on. Please. People... ask questions.");
    G.bag.cage+=5;G.bag.salve+=3;G.money+=300;
    yield say("You received 5 Cages, 3 Salves and ¥300.");
    note('gloves',"Mother made me promise to keep my gloves on. She never touches me. She hovers.");
    return;
  }
  const s=stage();
  if(s===0)yield say("Mother: Go on. Alder's waiting. I'll be here.");
  else if(s===1)yield say("Mother: Be home before dark, dear.","Mother: ...Or don't. I'll leave the window open, as I always do.");

    "Edda sits at the table. Three bowls. One is already steaming in front of your chair.",
    "Edda: I made stew. I know it tastes of nothing. I make it anyway. It's the only way I know to say it.");
  const c=yield ask("The bowl steams in front of you.",["Eat a spoonful.","Push the bowl away."]);
  if(c===0)yield say("Nothing. Warm nothing. You swallow anyway.","Edda watches as if you had done something heroic. Her eyes shine. She pretends it's the steam.");
  else yield say("Edda: That's all right. It'll keep. It always keeps.","She does not look hurt. She looks like someone who has been pushed away every night for fifteen years, and sets the bowl down again anyway.");
  yield say("Edda: The third bowl isn't for you. I should say that. It's for someone who isn't coming. I set it every night.",
    "Her hand drifts across the table toward yours, and stops an inch away, as it always does.",
    "Then, slowly, she turns it palm up and lays it flat on the wood beside yours. And leaves it there. Like leaving a window open.");
  note('kitchen',"Mother made stew I can't taste. She says she makes it anyway. She laid her hand beside mine on the table and didn't touch me.");
}

function* finaleScene(){
  if(F.finale)return;
  F.finale=1;
  healAll();
  yield say("The lamp room. Glass on all sides, black fen below, moonlight like spilled milk.",
    "Professor Alder stands at the lamp's brass heart. For the first time since you met him, there is no table between you.",
    "Alder: Fifteen years. I rehearsed this so many times. In every version, you were smaller.",
    "Alder: Sit, if you like. You won't. You never do.");
  yield ask("What do you say?",["What am I?","Why did you let me?","Tell me everything."]);
  yield say("Alder: The Hollow is the oldest predator in the fen. It was never meant to be killed. It can't be. It can only be fed, or sealed.",
    "Alder: Fifteen years ago the Council sealed the last. Or so we thought. A fragment slipped away in the Great Rain, starving, wounded, small.",
    "Alder: It crawled into Ashmere and scratched at the door of a woman named Edda.",
    "Alder: Her daughter, Wren, had died of fever that spring. The Hollow, you, wanted warmth. It wanted a shape that would be let in. And it chose the one she was most desperate to see.",
    "Alder: I found you the next morning in her kitchen, eating bread you couldn't taste. Edda looked at me with a look I have never forgotten. And I did not report you.",
    "Alder: I told myself I would study you. A Hollow that forgot itself! I gave you a childhood. A hobby. Catch and Cage. Feed the hunger a little at a time, until it passes for play.",
    "Alder: The Wilds in your cages aren't kept, child. They're fed on. A little each time. That is how a Hollow stays small.",
    "Alder: You typed a name on your first morning, do you remember? You didn't have one. You needed one. 'Wren' never came to you, did it?",
    "Alder: The Council wants you sealed. They're right. I have known they're right for fifteen years, and I could not do it.",
    "Alder: So here is my failure. Fight me. If you cannot beat an old man and his hounds, you are no danger to anyone.",
    "Alder: The seal is in this lamp. I can use it on you now, or I can fail. Let your hands decide. I'm too much of a coward to.");
  while(true){
    const r=yield* doBattle({kind:'trainer',team:[{sp:'wardhound',lv:18},{sp:'gloomjaw',lv:19},{sp:'elderhart',lv:21}],trainer:{name:'Professor Alder'},bg:'tower'});
    if(r==='win'||r==='ran')break;
    healAll();yield say("Alder: Not yet. Rest. Again.");
  }
  yield say("Alder: ...Good. Good.","He sits down on the stair, suddenly very old.",
    "Footsteps on the stairs. Uneven. Someone climbing too fast, too old.");
  F.motherHere=true;
  yield say("Edda: Don't. Please. Both of you.",
    "She is wearing her gloves. She made them herself, for you, and you have never once thought to ask why they were so big.",
    "Edda: I'm not asking you to be Wren. I stopped asking years ago.",
    "Edda: Alder. You've carried the telling for fifteen years. Let me carry the rest.",
    "Edda: Sit with me, both of you. Please.");
  note('finale',"I am the Hollow. I was never hunting the Wilds. I was eating.");
  yield fade(1,600);
  yield cut("Fifteen years ago. The seventh night of the Great Rain. Wren is buried by noon.",
    "Edda sits alone at the kitchen table with a child's drawing in her fist and a house so quiet she can hear her own blood.",
    "Something scratches at the window. She does not look. She knows what scratches at windows in the rain, and she is past caring.",
    "It comes in. It is small, and starving, and it has already learned her daughter's face from the way she was crying.",
    "It stands there with Wren's gap-toothed mouth and Wren's small hands, and it looks at Edda the way a wolf looks at something it has not yet decided about.",
    "Edda knew exactly what it was. She asked, 'Are you hungry?'",
    "'Yes,' it said.",
    "She set the table for three. And she did not run.");
  yield fade(0,700);
  yield say("Edda: I knew in an hour. You didn't cough. You didn't blink. You looked at my throat when you thought I wasn't watching.",
    "Edda: I could have called the Wardens. I didn't. I would rather be eaten by something wearing her face than sit in that silence one more night.",
    "Edda: That wasn't love, {n}. Don't let anyone tell you it was. It was need. I was a coward, and you were a monster, and we kept each other alive.",
    "Edda: I found the marks under your mattress when you were ten. I thought it was a game.",
    "Edda: It isn't. Every time you remember what you are, you scratch a line. And then you choose to forget. Nobody makes you. I never asked you to.",
    "Edda: Four hundred and twelve times you have known, and chosen to be my child instead. And every morning you call me Mother.",
    "Edda: I have never decided whether that is the cruellest thing I've done, or the kindest.",
    "She takes off her gloves, first one, then the other. Her hands are old and spotted and shaking.",
    "In fifteen years she has never once touched your face. She stops, an inch away, the way she always has.",
    "And then she closes the inch.",
    "Her palm is warm. For one breath you remember everything: the grass, the small warm things, the taste of her grief on the first night.",
    "The hunger does not go away. It sits behind your eyes, patient, and looks at her throat. She can feel it. She does not pull her hand away.",
    "Edda: {n}. It's the name you gave yourself. It was never hers. It was only ever yours.",
    "Edda: Whatever you decide, I'm not going anywhere. I have never been brave. I have only been here.");
  note('forget',"Edda knew from the first hour. She let me in because she couldn't bear the quiet. The marks under my mattress are every time I remembered what I am and chose to forget.");
  const c=yield ask("What will you do?",["Let them seal me.","Open every cage. Go to the fen.","Eat.","Take the mask. Go home. Forget."]);
  yield* ending(c);
}

function* ending(k){
  const names=['SEALED','THE FEN','THE HOLLOW','THE MASK'];
  yield fade(1,900);
  const L=[
    ["You walk to the lamp yourself.","Alder's hands shake on the brass. 'It won't hurt,' he says, and for once he sounds like a liar by choice.","Light fills the lamp room. Gold, not white. The colour of the lamp in Edda's kitchen.","Across the fen, the Wilds you caged wake and remember how to sing.","Edda holds your gloved hand until the light is gone. She does not let go first. She never once lets go first.","In Ashmere, Edda sets the table for one. Then a second plate, then a third, and sits with all of them until the soup goes cold.","Under the mattress, the marks have stopped at 412. She keeps the chalk anyway, in case you come home and need to start again.","On the pier at dusk, three figures in cream cloaks light a candle and do not say why. A Dusklet circles the flame until it burns down.","Pip leaves a crumb on the pier. In the morning it is still there. She leaves a second one, just to be sure."],
    ["You take every Cage from your belt and open them, one by one.","Nobody runs. They look at you a long time. Then they go, into the reeds, into the dark, into being something that is not yours.",G.mercy>=5?"The fen remembers every Wild you let go. They gather at the shore to see you off.":"The fen does not forgive you. But it makes room.","The Elder Heron waits at the water. 'You are still hungry,' it says. 'So are we all. Come and learn what to do with it.'","You do not go home that night. Or the next. Edda leaves the window open, as always.","In Ashmere, children say a quiet creature watches from the reeds at dusk. They leave bread on the pier. It takes the bread, though it can't taste it.","Vesper, Tuck and a Dusklet named Mothball build a small house at the edge of the reeds, with a lantern in every window. They have retired from villainy. Reluctantly.","Edda leaves the window open, as always. One morning there is a crumb on the sill and a name scratched beside it, in a hand that is still learning to write.","Some mornings it leaves a feather in return."],
    ["The Cages open, but not to release.","Everything you have ever caged comes back to you, and it is warm, and it is yours. You remember how to eat.","Alder doesn't scream. He seems, if anything, relieved.","Edda reaches out a gloved hand. You look at it for a long moment. You have never been able to taste bread. But you have an excellent memory for what everything else tastes like.","By morning, Ashmere is quiet. Not silent. Quiet, the way a held breath is quiet.","No bird sings. Pip's mother does not let her out.","Vesper stands in the lane with a lantern held high, the only one who does not run. 'You will not have her,' she says, and her voice breaks on it. 'Not her.'","And somewhere in the fen, an enormous, lonely thing lies down at last, full. A single Dusklet circles it, and does not leave."],
    ["Alder opens his palm. In it, a small bronze charm: the amulet he has worn every day you have known him.","'The last of its kind,' he says. 'One more mask. One more childhood. You won't remember. Edda will.'","You nod. Edda cries. The brass lamp burns the memory out of you, gently, like falling asleep in a warm bath.","You wake in a narrow bed in Ashmere. Seven days of rain, then quiet. Something tastes strange in your mouth.","Mother calls up the stairs: 'Today's the day!'","Under the mattress, the wood is scratched with thousands of tally marks. You know exactly what they count. Each is a time you knew, and chose to forget. You do not know how many it will take.","Edda watches you from the doorway the way one watches a door one still leaves unlocked. 'Good morning, dear,' she says, and does not say the name.","On the pier, three strangers in cream cloaks leave bread out at dusk. They cannot say why. A Dusklet taps at your window every night, and every night you leave it open.","Tonight you scratch another."]
  ][k];
  yield cut(...L);
  S.end={name:names[k],k};S.mode='endcard';gen=null;cur=null;
  saveGame();
}

function newGame(name){
  G={name,map:'home',party:[],box:[],bag:{cage:0,iron:0,salve:0},money:0,F:{},notes:[],seen:{},caught:{},
    steps:0,mercy:0,spared:0,hunted:0,lastHeal:{map:'ashmere',x:7,y:9},mask:false,x:2,y:3,dir:0};

}
function* introScript(){
  S.mode='intro';
  yield cut("ASHMERE.","Seven days of rain. Then, this morning, quiet.","You wake with a taste in your mouth you can't name.");
  const name=yield {t:'name'};
  G.name=name;S.fade=1;
  setMap('home',2,3,0);S.mode='world';
  yield wait(300);yield fade(0,900);
  yield say("Today the Wardens open the License to Ashmere's young. Everyone has been talking about it for weeks.",
    "You have been talking about it too.","You don't remember deciding to want it.",
    "Mother is by the stove, humming. She stops when she sees you're awake.");
}
function startNew(){
  newGame('');S.fade=0;
  startScript(introScript);
}
function continueGame(){
  const s=loadSave();if(!s)return;
  G=s;F=G.F;setMap(G.map,G.x,G.y,G.dir);S.mode='world';S.fade=0;
}
function toTitle(){G=null;F={};S.mode='title';S.sel=0;S.fade=0;S.menu=null;gen=null;cur=null;S.end=null;}

function updTitle(){
  const has=!!loadSave();

    drawMon(id,x,y,60,{fear:true});g.globalAlpha=1;});

  tri(hx-14,hy-12,hx-30,hy-52,hx-4,hy-20,'rgba(0,0,0,.55)');tri(hx+14,hy-12,hx+30,hy-52,hx+4,hy-20,'rgba(0,0,0,.55)');

  const glitch=Math.floor(S.t*3)%11===0;
  text('HOLLOW HUNT',W/2+(glitch?4:0),70,64,glitch?'#d83a3a':'#e8c660','center',true);
  if(glitch)text('HOLLOW HUNT',W/2-3,72,64,'#3a9ad8','center',true);

  text((S.sel===0?'▶ ':'  ')+'NEW GAME',W/2,H-90,24,S.sel===0?'#e8c660':'#8a80a0','center');
  if(has)text((S.sel===1?'▶ ':'  ')+'CONTINUE',W/2,H-56,24,S.sel===1?'#e8c660':'#8a80a0','center');
  text('Arrows / WASD move   Z / Enter confirm   X / Esc back / menu',W/2,H-22,13,'#5a5070','center');
}
function drawEnd(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const e=S.end;
  text('ENDING '+(e.k+1)+' OF 4',W/2,60,16,'#6a6078','center');
  text(e.name,W/2,90,64,['#e8c660','#58b04a','#d83a3a','#c8c8dc'][e.k],'center',true);
  const st=[`Wilds caged: ${G.hunted}`,`Wilds spared or released: ${G.spared}`,`Journal entries: ${G.notes.length}`,`Steps taken: ${G.steps}`];
  st.forEach((s,i)=>text(s,W/2,200+i*30,20,'#d8d0e8','center'));
  box(100,350,600,140);
  text('WILDBOOK  #000',130,368,18,'#d83a3a',undefined,true);
  wrap("THE HOLLOW. It wears the shape of a child. It hungers. It did not know it was hungry. Seen: 1. Caged: 0.",520,FONT(18)).forEach((ln,i)=>text(ln,130,400+i*26,18,'#d8d0e8'));
  if(Math.floor(S.t*2)%2)text('Press Z to return to the title',W/2,520,18,'#8a80a0','center');
}

function update(dt){
  S.t+=dt;
  for(const k of ['area','toast','whisper'])if(S[k]&&S[k].t>0)S[k].t-=dt;
  if(S.shakeT>0)S.shakeT-=dt;
  if(Math.floor(S.t)%5===0)droneTick();
  switch(S.mode){
    case 'title':updTitle();break;
    case 'intro':if(gen)updCmd(dt);break;
    case 'world':updWorld(dt);break;
    case 'battle':updBattleAnim(dt);if(gen)updCmd(dt);break;
    case 'endcard':S.fade=0;if(isA()){toTitle();}break;
  }
  hit.clear();
}
function draw(){
  switch(S.mode){
    case 'title':drawTitle();break;
    case 'intro':g.fillStyle='#000';g.fillRect(0,0,W,H);break;
    case 'world':drawWorld();if(S.menu)drawMenu();break;
    case 'battle':drawBattle();break;
    case 'endcard':drawEnd();break;
  }
  const full=cur&&(cur.t==='cut'||cur.t==='name');
  if(!full)drawCmd();
  if(S.fade>0){g.fillStyle=`rgba(0,0,0,${S.fade})`;g.fillRect(0,0,W,H);}
  if(full)drawCmd();
}
